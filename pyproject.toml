[project]
name = "minu"
version = "0.1.0"
description = "Tiny agent harness for local models (llama.cpp, MLX, Ollama)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mr-jones123", email = "lacapxyniljhed@gmail.com" }]
keywords = ["agent", "llm", "local-llm", "llama.cpp", "mlx", "ollama", "tui", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = ["textual>=1.0", "textual-image>=0.8", "pillow>=10.3"]

[project.optional-dependencies]
mlx = ["mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://github.com/mr-jones123/minu"
Repository = "https://github.com/mr-jones123/minu"
Issues = "https://github.com/mr-jones123/minu/issues"

[project.scripts]
minu = "minu.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
